name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    # .env points at the compose hostname mariadb; in CI the service is on loopback.
    env:
      DATABASE_URL: 'mysql://root:root@127.0.0.1:3306/invoice_book?serverVersion=11.4.12-MariaDB&charset=utf8mb4'

    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: invoice_book
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      # pinned to a commit, an action tag is mutable
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          extensions: ctype, iconv, pdo_mysql, bcmath
          ini-values: date.timezone=UTC
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: Warm up the dev container
        run: php bin/console cache:warmup --env=dev

      - name: Coding standard
        run: vendor/bin/phpcs

      - name: Static analysis
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=256M

      - name: Rector
        run: vendor/bin/rector process --dry-run --no-progress-bar

      - name: Config check
        run: php tools/check-config.php

      - name: Test database
        run: |
          php bin/console doctrine:database:create --env=test --if-not-exists
          php bin/console doctrine:migrations:migrate --env=test --no-interaction

      - name: Mapping against the migrations
        run: php bin/console doctrine:schema:validate --env=test

      - name: Tests
        run: vendor/bin/phpunit

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint .

      - name: Tests
        run: npx vitest run

  types:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          extensions: ctype, iconv, pdo_mysql, bcmath
          ini-values: date.timezone=UTC
          coverage: none

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          composer install --no-interaction --no-progress
          npm ci --prefix frontend

      - name: Export the OpenAPI document
        run: php bin/console api:openapi:export --output=var/openapi.json

      - name: Regenerate the types and fail if the committed file differs
        working-directory: frontend
        run: |
          npx openapi-typescript ../var/openapi.json -o src/api/schema/schema.d.ts
          git diff --exit-code -- src/api/schema/schema.d.ts || (echo '::error::schema.d.ts differs from the API: commit the regenerated file, never edit it by hand' && exit 1)
