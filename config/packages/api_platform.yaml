api_platform:
    title: 'invoice-book'
    description: 'Kniha faktur — referenční aplikace'
    version: '1.0.0'
    defaults:
        # a value of the wrong type is otherwise a bare 400, with no field for the form to show it under
        collect_denormalization_errors: true
        normalization_context:
            skip_null_values: false
    exception_to_status:
        App\Exception\InvoiceNotFoundException: 404
        App\Exception\UnmatchedInvoiceItemException: 422
    graphql:
        # the graphql-js 16 introspection query is 13 deep, lower breaks GraphiQL; invoice queries are 3
        max_query_depth: 13
        max_query_complexity: 50

when@prod:
    api_platform:
        graphql:
            graphiql:
                enabled: false
            introspection:
                enabled: false
